<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xyz:SILVER Monitor</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid #333; margin-bottom: 20px; }
        h1 { color: #00d4aa; font-size: 1.8rem; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #111; border-radius: 8px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .status { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #ff4444; }
        .status-dot.connected { background: #00d4aa; }
        .stats { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-value { font-size: 1.1rem; color: #00d4aa; font-weight: bold; }
        .stat-label { font-size: 0.65rem; color: #666; }
        .chart-container { background: #111; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        #chart { width: 100%; height: 350px; }
        .interval-buttons { margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .interval-buttons button { background: #222; color: #888; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .interval-buttons button.active { background: #00d4aa; color: #000; }
        .interval-buttons button:hover { background: #333; }
        .info { font-size: 0.7rem; color: #666; margin-left: 10px; }
        .trades-container { background: #111; border-radius: 12px; overflow: hidden; }
        .trades-header { display: grid; grid-template-columns: 80px 95px 75px 85px 1fr 1fr 55px; padding: 12px 15px; background: #1a1a2e; color: #888; font-size: 0.75rem; }
        .trades-list { max-height: 250px; overflow-y: auto; }
        .trade-row { display: grid; grid-template-columns: 80px 95px 75px 85px 1fr 1fr 55px; padding: 8px 15px; border-bottom: 1px solid #222; font-size: 0.75rem; }
        .side-buy { color: #00d4aa; font-weight: bold; }
        .side-sell { color: #ff4757; font-weight: bold; }
        .address a { color: #6c7a89; text-decoration: none; font-size: 0.7rem; }
        .address a:hover { color: #00d4aa; }
        footer { text-align: center; padding: 15px; color: #444; font-size: 0.7rem; }
        footer a { color: #00d4aa; }
        .btn-action { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-left: 5px; }
        .btn-export { background: #1a5fb4; color: #fff; }
        .btn-clear { background: #ff4757; color: #fff; }
        .btn-action:hover { opacity: 0.8; }
        .storage-bar { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>xyz:SILVER Monitor</h1>
            <p style="color:#888;font-size:0.85rem;">Real-time Chart & Trades with Data Storage</p>
        </header>
        <div class="status-bar">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
            <div class="stats">
                <div class="stat"><div class="stat-value" id="currentPrice">$--</div><div class="stat-label">Price</div></div>
                <div class="stat"><div class="stat-value" id="sessionTrades">0</div><div class="stat-label">Session</div></div>
                <div class="stat"><div class="stat-value" id="totalTrades">0</div><div class="stat-label">Total Saved</div></div>
                <div class="stat"><div class="stat-value" id="totalCandles">0</div><div class="stat-label">Candles</div></div>
                <div class="stat"><div class="stat-value" id="dataSize">0 KB</div><div class="stat-label">Data Size</div></div>
            </div>
        </div>
        <div class="chart-container">
            <div class="interval-buttons">
                <button onclick="changeInterval('1s')">1s</button>
                <button onclick="changeInterval('5s')">5s</button>
                <button onclick="changeInterval('15s')">15s</button>
                <button onclick="changeInterval('1m')" class="active">1m</button>
                <button onclick="changeInterval('5m')">5m</button>
                <button onclick="changeInterval('15m')">15m</button>
                <button onclick="changeInterval('1h')">1h</button>
                <span class="info" id="chartInfo">1m</span>
            </div>
            <div id="chart"></div>
            <div class="storage-bar">
                <button class="btn-action btn-export" onclick="exportTradesCSV()">Export Trades CSV</button>
                <button class="btn-action btn-export" onclick="exportCandlesCSV()">Export Candles CSV</button>
                <button class="btn-action btn-clear" onclick="clearAllData()">Clear All Data</button>
            </div>
        </div>
        <div class="trades-container">
            <div class="trades-header">
                <div>Time</div><div>Price</div><div>Size</div><div>Value</div><div>Buyer</div><div>Seller</div><div>Side</div>
            </div>
            <div class="trades-list" id="tradesList">
                <div style="padding:30px;text-align:center;color:#666;">Waiting for trades...</div>
            </div>
        </div>
        <footer>
            <p>Data from <a href="https://app.hyperliquid.xyz/trade/xyz:SILVER" target="_blank">Hyperliquid</a> | Trades & Candles saved in IndexedDB</p>
        </footer>
    </div>
    <script>
        const COIN = 'xyz:SILVER', MAX_DISPLAY_TRADES = 50, DB_NAME = 'SilverMonitorDB', DB_VERSION = 1;
        let ws, sessionTrades = 0, currentInterval = '1m';
        let chart, candleSeries, db;
        
        const intervals = ['1s', '5s', '15s', '1m', '5m', '15m', '1h'];
        const intervalSeconds = { '1s': 1, '5s': 5, '15s': 15, '1m': 60, '5m': 300, '15m': 900, '1h': 3600 };
        let candleData = {};
        intervals.forEach(i => candleData[i] = {});

        // ===== IndexedDB =====
        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => { db = request.result; resolve(db); };
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('trades')) {
                        const tradeStore = db.createObjectStore('trades', { keyPath: 'id', autoIncrement: true });
                        tradeStore.createIndex('time', 'time', { unique: false });
                    }
                    if (!db.objectStoreNames.contains('candles')) {
                        db.createObjectStore('candles', { keyPath: 'key' });
                    }
                };
            });
        }

        async function saveTrade(trade) {
            if (!db) return;
            const tx = db.transaction('trades', 'readwrite');
            const store = tx.objectStore('trades');
            const users = trade.users || ['?', '?'];
            store.add({
                time: trade.time,
                price: parseFloat(trade.px),
                size: parseFloat(trade.sz),
                side: trade.side,
                buyer: users[0],
                seller: users[1],
                hash: trade.hash || ''
            });
        }

        async function saveCandles() {
            if (!db) return;
            const tx = db.transaction('candles', 'readwrite');
            const store = tx.objectStore('candles');
            store.put({ key: 'data', candles: candleData, updated: Date.now() });
        }

        async function loadCandles() {
            if (!db) return;
            const tx = db.transaction('candles', 'readonly');
            const store = tx.objectStore('candles');
            const request = store.get('data');
            return new Promise(resolve => {
                request.onsuccess = () => {
                    if (request.result && request.result.candles) {
                        candleData = request.result.candles;
                    }
                    resolve();
                };
                request.onerror = () => resolve();
            });
        }

        async function getTradeCount() {
            if (!db) return 0;
            const tx = db.transaction('trades', 'readonly');
            const store = tx.objectStore('trades');
            return new Promise(resolve => {
                const request = store.count();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => resolve(0);
            });
        }

        async function getAllTrades() {
            if (!db) return [];
            const tx = db.transaction('trades', 'readonly');
            const store = tx.objectStore('trades');
            return new Promise(resolve => {
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result || []);
                request.onerror = () => resolve([]);
            });
        }

        async function clearAllData() {
            if (!confirm('全ての約定履歴とローソク足データを削除しますか？')) return;
            const tx = db.transaction(['trades', 'candles'], 'readwrite');
            tx.objectStore('trades').clear();
            tx.objectStore('candles').clear();
            intervals.forEach(i => candleData[i] = {});
            updateChart();
            updateStats();
            alert('データを削除しました');
        }

        async function exportTradesCSV() {
            const trades = await getAllTrades();
            if (trades.length === 0) { alert('エクスポートするデータがありません'); return; }
            
            let csv = 'Time,DateTime,Price,Size,Value,Side,Buyer,Seller,Hash\n';
            trades.forEach(t => {
                const dt = new Date(t.time).toISOString();
                const value = (t.price * t.size).toFixed(2);
                const side = t.side === 'A' ? 'BUY' : 'SELL';
                csv += `${t.time},${dt},${t.price},${t.size},${value},${side},${t.buyer},${t.seller},${t.hash}\n`;
            });
            
            downloadCSV(csv, `xyz_silver_trades_${Date.now()}.csv`);
        }

        function exportCandlesCSV() {
            const interval = currentInterval;
            const data = Object.values(candleData[interval]).sort((a, b) => a.time - b.time);
            if (data.length === 0) { alert('エクスポートするデータがありません'); return; }
            
            let csv = 'Time,DateTime,Open,High,Low,Close\n';
            data.forEach(c => {
                const dt = new Date(c.time * 1000).toISOString();
                csv += `${c.time},${dt},${c.open},${c.high},${c.low},${c.close}\n`;
            });
            
            downloadCSV(csv, `xyz_silver_candles_${interval}_${Date.now()}.csv`);
        }

        function downloadCSV(content, filename) {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        async function updateStats() {
            const count = await getTradeCount();
            document.getElementById('totalTrades').textContent = count.toLocaleString();
            
            let totalCandles = 0;
            intervals.forEach(i => totalCandles += Object.keys(candleData[i]).length);
            document.getElementById('totalCandles').textContent = totalCandles.toLocaleString();
            
            // データサイズ概算
            const size = JSON.stringify(candleData).length + (count * 200);
            document.getElementById('dataSize').textContent = (size / 1024).toFixed(1) + ' KB';
        }

        // ===== Chart =====
        function initChart() {
            const container = document.getElementById('chart');
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: 350,
                layout: { background: { type: 'solid', color: '#111' }, textColor: '#888' },
                grid: { vertLines: { color: '#222' }, horzLines: { color: '#222' } },
                rightPriceScale: { borderColor: '#333' },
                timeScale: { borderColor: '#333', timeVisible: true, secondsVisible: true },
                localization: { priceFormatter: p => p.toFixed(3) }
            });
            candleSeries = chart.addCandlestickSeries({
                upColor: '#00d4aa', downColor: '#ff4757',
                borderUpColor: '#00d4aa', borderDownColor: '#ff4757',
                wickUpColor: '#00d4aa', wickDownColor: '#ff4757',
                priceFormat: { type: 'price', precision: 3, minMove: 0.001 }
            });
            window.addEventListener('resize', () => chart.applyOptions({ width: container.clientWidth }));
        }

        function updateAllCandles(trade) {
            const price = parseFloat(trade.px);
            const tradeSec = Math.floor(trade.time / 1000);
            
            intervals.forEach(interval => {
                const sec = intervalSeconds[interval];
                const candleTime = Math.floor(tradeSec / sec) * sec;
                
                if (!candleData[interval][candleTime]) {
                    candleData[interval][candleTime] = { time: candleTime, open: price, high: price, low: price, close: price };
                } else {
                    const c = candleData[interval][candleTime];
                    c.high = Math.max(c.high, price);
                    c.low = Math.min(c.low, price);
                    c.close = price;
                }
            });
            
            updateChart();
        }

        function updateChart() {
            const data = candleData[currentInterval];
            const sorted = Object.values(data).sort((a, b) => a.time - b.time);
            candleSeries.setData(sorted);
            document.getElementById('chartInfo').textContent = `${currentInterval} (${sorted.length})`;
        }

        function changeInterval(interval) {
            currentInterval = interval;
            document.querySelectorAll('.interval-buttons button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            updateChart();
            chart.timeScale().fitContent();
        }

        // ===== Trades =====
        const formatTime = ts => new Date(ts).toLocaleTimeString('ja-JP');
        const formatPrice = p => '$' + parseFloat(p).toFixed(3);
        const formatVol = v => v >= 1e6 ? '$'+(v/1e6).toFixed(2)+'M' : v >= 1e3 ? '$'+(v/1e3).toFixed(2)+'K' : '$'+v.toFixed(2);
        const shortAddr = a => a && a.length > 12 ? a.slice(0,6)+'...'+a.slice(-4) : a || '?';

        function updateStatus(connected, text) {
            document.getElementById('statusDot').classList.toggle('connected', connected);
            document.getElementById('statusText').textContent = text || (connected ? 'Connected' : 'Disconnected');
        }

        function addTrade(t) {
            const list = document.getElementById('tradesList');
            if (sessionTrades === 0) list.innerHTML = '';
            
            sessionTrades++;
            document.getElementById('sessionTrades').textContent = sessionTrades;
            document.getElementById('currentPrice').textContent = formatPrice(t.px);
            
            // 全時間足を更新
            updateAllCandles(t);
            
            // IndexedDBに保存
            saveTrade(t);
            
            // 表示用
            const users = t.users || ['?','?'], price = parseFloat(t.px), size = parseFloat(t.sz), value = price * size, isBuy = t.side === 'A';
            const row = document.createElement('div');
            row.className = 'trade-row';
            row.innerHTML = '<div>' + formatTime(t.time) + '</div><div>' + formatPrice(t.px) + '</div><div>' + size.toFixed(2) + '</div><div>' + formatVol(value) + '</div><div class="address"><a href="https://hyperbot.network/trader/' + users[0] + '" target="_blank">' + shortAddr(users[0]) + '</a></div><div class="address"><a href="https://hyperbot.network/trader/' + users[1] + '" target="_blank">' + shortAddr(users[1]) + '</a></div><div class="' + (isBuy ? 'side-buy' : 'side-sell') + '">' + (isBuy ? 'BUY' : 'SELL') + '</div>';
            list.insertBefore(row, list.firstChild);
            while (list.children.length > MAX_DISPLAY_TRADES) list.removeChild(list.lastChild);
        }

        function connect() {
            updateStatus(false, 'Connecting...');
            ws = new WebSocket('wss://api.hyperliquid.xyz/ws');
            
            ws.onopen = () => {
                updateStatus(true, 'Connected');
                ws.send(JSON.stringify({ method: 'subscribe', subscription: { type: 'trades', coin: COIN } }));
            };
            
            ws.onmessage = (e) => {
                try {
                    const d = JSON.parse(e.data);
                    if (d.channel === 'trades' && d.data) d.data.forEach(addTrade);
                } catch (err) {}
            };
            
            ws.onclose = () => { updateStatus(false, 'Reconnecting...'); setTimeout(connect, 3000); };
            ws.onerror = () => updateStatus(false, 'Error');
        }

        // ===== Init =====
        async function init() {
            await openDB();
            await loadCandles();
            initChart();
            updateChart();
            await updateStats();
            connect();
            
            // 定期保存 & 統計更新
            setInterval(() => { saveCandles(); updateStats(); }, 10000);
        }
        
        init();
    </script>
</body>
</html>
