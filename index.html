<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xyz:SILVER Trades Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #333; margin-bottom: 20px; }
        h1 { color: #00d4aa; font-size: 2rem; margin-bottom: 10px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #111; border-radius: 8px; margin-bottom: 20px; }
        .status { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #ff4444; animation: pulse 2s infinite; }
        .status-dot.connected { background: #00d4aa; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .stats { display: flex; gap: 30px; }
        .stat-value { font-size: 1.5rem; color: #00d4aa; font-weight: bold; }
        .stat-label { font-size: 0.75rem; color: #666; }
        .price-display { text-align: center; padding: 30px; background: linear-gradient(135deg, #111 0%, #1a1a2e 100%); border-radius: 12px; margin-bottom: 20px; }
        .current-price { font-size: 3rem; font-weight: bold; color: #fff; }
        .price-change { font-size: 1.2rem; margin-top: 5px; }
        .price-up { color: #00d4aa; }
        .price-down { color: #ff4757; }
        .trades-container { background: #111; border-radius: 12px; overflow: hidden; }
        .trades-header { display: grid; grid-template-columns: 90px 110px 90px 100px 1fr 1fr 70px; padding: 15px 20px; background: #1a1a2e; font-weight: bold; color: #888; font-size: 0.85rem; }
        .trades-list { max-height: 500px; overflow-y: auto; }
        .trade-row { display: grid; grid-template-columns: 90px 110px 90px 100px 1fr 1fr 70px; padding: 10px 20px; border-bottom: 1px solid #222; font-size: 0.85rem; }
        .trade-row:hover { background: #1a1a2e; }
        .trade-row.new { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { background: rgba(0, 212, 170, 0.2); } to { background: transparent; } }
        .side-buy { color: #00d4aa; font-weight: bold; }
        .side-sell { color: #ff4757; font-weight: bold; }
        .address { color: #6c7a89; font-size: 0.8rem; }
        .address a { color: #6c7a89; text-decoration: none; }
        .address a:hover { color: #00d4aa; text-decoration: underline; }
        footer { text-align: center; padding: 20px; color: #444; font-size: 0.8rem; }
        footer a { color: #00d4aa; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>xyz:SILVER Trades Monitor</h1>
            <p style="color:#888;">Hyperliquid Real-time Trade Feed</p>
        </header>
        <div class="status-bar">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
            <div class="stats">
                <div class="stat"><div class="stat-value" id="tradeCount">0</div><div class="stat-label">Trades</div></div>
                <div class="stat"><div class="stat-value" id="volume">$0</div><div class="stat-label">Volume</div></div>
            </div>
        </div>
        <div class="price-display">
            <div class="current-price" id="currentPrice">$--</div>
            <div class="price-change" id="priceChange">--</div>
        </div>
        <div class="trades-container">
            <div class="trades-header">
                <div>Time</div><div>Price</div><div>Size</div><div>Value</div><div>Buyer</div><div>Seller</div><div>Side</div>
            </div>
            <div class="trades-list" id="tradesList">
                <div style="padding:40px;text-align:center;color:#666;">Waiting for trades...</div>
            </div>
        </div>
        <footer>
            <p>Data from <a href="https://app.hyperliquid.xyz/trade/xyz:SILVER" target="_blank">Hyperliquid</a></p>
        </footer>
    </div>
    <script>
        const WS_URL = 'wss://api.hyperliquid.xyz/ws', COIN = 'xyz:SILVER', MAX_TRADES = 100;
        let ws, tradeCount = 0, totalVolume = 0, lastPrice = null, firstPrice = null;

        const formatTime = ts => new Date(ts).toLocaleTimeString('ja-JP');
        const formatPrice = p => '$' + parseFloat(p).toFixed(4);
        const formatVol = v => v >= 1e6 ? '$'+(v/1e6).toFixed(2)+'M' : v >= 1e3 ? '$'+(v/1e3).toFixed(2)+'K' : '$'+v.toFixed(2);
        const shortAddr = a => a && a.length > 12 ? a.slice(0,6)+'...'+a.slice(-4) : a || '?';

        function updateStatus(c) {
            document.getElementById('statusDot').classList.toggle('connected', c);
            document.getElementById('statusText').textContent = c ? 'Connected' : 'Disconnected';
        }

        function updatePrice(p) {
            document.getElementById('currentPrice').textContent = formatPrice(p);
            if (!firstPrice) firstPrice = parseFloat(p);
            if (lastPrice) {
                const ch = parseFloat(p) - firstPrice, pct = ch / firstPrice * 100;
                document.getElementById('priceChange').textContent = (ch >= 0 ? '+' : '') + ch.toFixed(4) + ' (' + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%)';
                document.getElementById('priceChange').className = 'price-change ' + (ch >= 0 ? 'price-up' : 'price-down');
            }
            lastPrice = parseFloat(p);
        }

        function addTrade(t) {
            const list = document.getElementById('tradesList');
            if (!tradeCount) list.innerHTML = '';
            const users = t.users || ['?','?'], price = parseFloat(t.px), size = parseFloat(t.sz), value = price * size, isBuy = t.side === 'A';
            tradeCount++; totalVolume += value;
            document.getElementById('tradeCount').textContent = tradeCount;
            document.getElementById('volume').textContent = formatVol(totalVolume);
            updatePrice(t.px);
            const row = document.createElement('div');
            row.className = 'trade-row new';
            row.innerHTML = '<div>' + formatTime(t.time) + '</div><div>' + formatPrice(t.px) + '</div><div>' + size.toFixed(2) + '</div><div>' + formatVol(value) + '</div><div class="address"><a href="https://hyperbot.network/trader/' + users[0] + '" target="_blank" title="' + users[0] + '">' + shortAddr(users[0]) + '</a></div><div class="address"><a href="https://hyperbot.network/trader/' + users[1] + '" target="_blank" title="' + users[1] + '">' + shortAddr(users[1]) + '</a></div><div class="' + (isBuy ? 'side-buy' : 'side-sell') + '">' + (isBuy ? 'BUY' : 'SELL') + '</div>';
            list.insertBefore(row, list.firstChild);
            while (list.children.length > MAX_TRADES) list.removeChild(list.lastChild);
            setTimeout(() => row.classList.remove('new'), 500);
        }

        function connect() {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => { updateStatus(true); ws.send(JSON.stringify({method:'subscribe',subscription:{type:'trades',coin:COIN}})); };
            ws.onmessage = e => { try { const d = JSON.parse(e.data); if (d.channel === 'trades') (d.data || []).forEach(addTrade); } catch(err){} };
            ws.onclose = () => { updateStatus(false); setTimeout(connect, 3000); };
        }
        connect();
    </script>
</body>
</html>

</body>
</html>
