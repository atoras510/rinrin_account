<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xyz:SILVER | Monitor</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px 30px; }

        /* Header */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; margin-bottom: 20px; border-bottom: 1px solid #1a1a1a; }
        .pair-info { display: flex; align-items: center; gap: 15px; }
        .pair-name { font-size: 1.2rem; font-weight: 600; color: #fff; }
        .pair-name span { color: #666; font-weight: 400; font-size: 0.9rem; }
        .price-info { display: flex; align-items: center; gap: 20px; }
        .current-price { font-size: 1.5rem; font-weight: 700; color: #00c853; }
        .price-change { font-size: 0.85rem; padding: 4px 10px; border-radius: 4px; font-weight: 500; }
        .price-up { background: rgba(0,200,83,0.15); color: #00c853; }
        .price-down { background: rgba(255,82,82,0.15); color: #ff5252; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #666; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5252; }
        .status-dot.connected { background: #00c853; }

        /* Chart Section */
        .chart-section { background: #111; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
        .chart-toolbar { display: flex; align-items: center; gap: 6px; padding: 12px 20px; background: #151515; border-bottom: 1px solid #1a1a1a; }
        .tf-btn { background: transparent; border: none; color: #666; padding: 8px 14px; font-size: 0.82rem; cursor: pointer; border-radius: 6px; font-weight: 500; }
        .tf-btn:hover { background: #222; color: #fff; }
        .tf-btn.active { background: #1f1f1f; color: #fff; }
        .chart-info { margin-left: auto; font-size: 0.75rem; color: #444; }
        #chart { width: 100%; height: 380px; }

        /* Stats Row */
        .stats-row { display: flex; gap: 30px; padding: 12px 0; margin-bottom: 20px; font-size: 0.8rem; color: #555; }
        .stats-row span { color: #888; font-weight: 500; }

        /* Trades Section */
        .trades-section { background: #111; border-radius: 12px; overflow: hidden; }
        .trades-tabs { display: flex; align-items: center; padding: 0 20px; background: #151515; border-bottom: 1px solid #1a1a1a; }
        .tab { padding: 14px 20px; font-size: 0.9rem; color: #666; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 500; }
        .tab.active { color: #fff; border-bottom-color: #00c853; }
        .tab:hover { color: #aaa; }
        .trades-actions { margin-left: auto; display: flex; gap: 10px; padding: 10px 0; }
        .btn { padding: 8px 14px; border: none; border-radius: 6px; font-size: 0.78rem; cursor: pointer; font-weight: 500; }
        .btn-secondary { background: #222; color: #888; }
        .btn-secondary:hover { background: #2a2a2a; color: #fff; }
        .btn-danger { background: #ff5252; color: #fff; }
        .btn-danger:hover { background: #ff6b6b; }

        /* Table */
        .trades-table { width: 100%; }
        .table-header { display: grid; grid-template-columns: 150px 70px 100px 90px 100px 160px 160px 50px; padding: 14px 20px; background: #0d0d0d; border-bottom: 1px solid #1a1a1a; font-size: 0.75rem; color: #444; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .trades-body { height: 400px; overflow-y: auto; }
        .trade-row { display: grid; grid-template-columns: 150px 70px 100px 90px 100px 160px 160px 50px; padding: 12px 20px; border-bottom: 1px solid #151515; font-size: 0.85rem; align-items: center; transition: background 0.15s; }
        .trade-row:hover { background: #161616; }
        .trade-row.new { animation: highlight 0.5s; }
        @keyframes highlight { from { background: rgba(0,200,83,0.15); } to { background: transparent; } }

        .date { color: #777; }
        .type-buy { color: #00c853; font-weight: 600; }
        .type-sell { color: #ff5252; font-weight: 600; }
        .usd { color: #ddd; font-weight: 500; }
        .size { color: #888; }
        .price { color: #00c853; font-weight: 500; }
        
        .maker { display: flex; align-items: center; gap: 8px; }
        .maker a { color: #777; text-decoration: none; font-size: 0.8rem; }
        .maker a:hover { color: #00c853; }
        .pos { font-size: 0.72rem; padding: 3px 7px; border-radius: 4px; font-weight: 500; }
        .pos-long { color: #00c853; background: rgba(0,200,83,0.12); }
        .pos-short { color: #ff5252; background: rgba(255,82,82,0.12); }
        .pos-none { color: #444; }
        .pos-load { color: #333; }

        .txn a { color: #444; text-decoration: none; font-size: 1.1rem; }
        .txn a:hover { color: #00c853; }

        /* Scrollbar */
        .trades-body::-webkit-scrollbar { width: 6px; }
        .trades-body::-webkit-scrollbar-track { background: #111; }
        .trades-body::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
        .trades-body::-webkit-scrollbar-thumb:hover { background: #333; }

        .scroll-top { position: fixed; bottom: 25px; right: 25px; background: #00c853; color: #000; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; display: none; z-index: 100; font-weight: 600; font-size: 0.85rem; }
        .scroll-top:hover { background: #00e676; }

        .loading { text-align: center; padding: 50px; color: #444; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="pair-info">
                <div class="pair-name">xyz:SILVER <span>• Hyperliquid</span></div>
                <div class="status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Connecting...</span>
                </div>
            </div>
            <div class="price-info">
                <div class="current-price" id="currentPrice">$--</div>
                <div class="price-change price-up" id="priceChange">+0.00%</div>
            </div>
        </div>

        <div class="chart-section">
            <div class="chart-toolbar">
                <button class="tf-btn" onclick="changeInterval('1s')">1s</button>
                <button class="tf-btn" onclick="changeInterval('5s')">5s</button>
                <button class="tf-btn active" onclick="changeInterval('1m')">1m</button>
                <button class="tf-btn" onclick="changeInterval('5m')">5m</button>
                <button class="tf-btn" onclick="changeInterval('15m')">15m</button>
                <button class="tf-btn" onclick="changeInterval('1h')">1h</button>
                <span class="chart-info" id="chartInfo">Candles: 0</span>
            </div>
            <div id="chart"></div>
        </div>

        <div class="stats-row">
            <div>Trades: <span id="totalTrades">0</span></div>
            <div>Data: <span id="dataSize">0 KB</span></div>
        </div>

        <div class="trades-section">
            <div class="trades-tabs">
                <div class="tab active">Transactions</div>
                <div class="trades-actions">
                    <button class="btn btn-secondary" onclick="exportCSV()">Export CSV</button>
                    <button class="btn btn-danger" onclick="clearAllData()">Clear</button>
                </div>
            </div>
            <div class="trades-table">
                <div class="table-header">
                    <div>DATE</div>
                    <div>TYPE</div>
                    <div>USD</div>
                    <div>SIZE</div>
                    <div>PRICE</div>
                    <div>BUYER</div>
                    <div>SELLER</div>
                    <div>TXN</div>
                </div>
                <div class="trades-body" id="tradesList">
                    <div class="loading">Waiting for trades...</div>
                </div>
            </div>
        </div>
    </div>

    <button class="scroll-top" id="scrollTop" onclick="scrollToTop()">↑ Latest</button>

    <script>
        const COIN = 'xyz:SILVER', DEX = 'xyz', DB_NAME = 'SilverMonitorDB', DB_VERSION = 2;
        const BATCH_SIZE = 100, POSITION_CACHE_TTL = 30000;
        let ws, db, chart, candleSeries, currentInterval = '1m', isLoadingMore = false, oldestLoadedId = Infinity;
        let firstPrice = null;
        const positionCache = new Map();
        const intervals = ['1s', '5s', '1m', '5m', '15m', '1h'];
        const intervalSeconds = { '1s': 1, '5s': 5, '1m': 60, '5m': 300, '15m': 900, '1h': 3600 };
        let candleData = {}; intervals.forEach(i => candleData[i] = {});

        async function fetchPosition(address) {
            const cached = positionCache.get(address);
            if (cached && Date.now() - cached.time < POSITION_CACHE_TTL) return cached.position;
            try {
                const res = await fetch('https://api.hyperliquid.xyz/info', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'clearinghouseState', user: address, dex: DEX })
                });
                const data = await res.json();
                let position = 0;
                if (data?.assetPositions) {
                    const pos = data.assetPositions.find(p => p.position?.coin === COIN);
                    if (pos?.position) position = parseFloat(pos.position.szi) || 0;
                }
                positionCache.set(address, { position, time: Date.now() });
                return position;
            } catch { return null; }
        }

        function fmtPos(p) {
            if (p === null) return '<span class="pos pos-load">-</span>';
            if (p === 0) return '<span class="pos pos-none">0</span>';
            return p > 0 ? `<span class="pos pos-long">+${p.toFixed(2)}</span>` : `<span class="pos pos-short">${p.toFixed(2)}</span>`;
        }

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onerror = () => reject(req.error);
                req.onsuccess = () => { db = req.result; resolve(db); };
                req.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains('trades')) {
                        const s = d.createObjectStore('trades', { keyPath: 'id', autoIncrement: true });
                        s.createIndex('time', 'time', { unique: false });
                    }
                    if (!d.objectStoreNames.contains('candles')) d.createObjectStore('candles', { keyPath: 'key' });
                };
            });
        }

        async function saveTrade(trade) {
            if (!db) return null;
            return new Promise(resolve => {
                const tx = db.transaction('trades', 'readwrite');
                const users = trade.users || ['?', '?'];
                const req = tx.objectStore('trades').add({
                    time: trade.time, price: parseFloat(trade.px), size: parseFloat(trade.sz),
                    side: trade.side, buyer: users[0], seller: users[1], hash: trade.hash || ''
                });
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }

        async function getTradesPage(beforeId = Infinity, limit = BATCH_SIZE) {
            if (!db) return [];
            return new Promise(resolve => {
                const tx = db.transaction('trades', 'readonly');
                const results = [];
                const req = tx.objectStore('trades').openCursor(IDBKeyRange.upperBound(beforeId, true), 'prev');
                req.onsuccess = (e) => {
                    const c = e.target.result;
                    if (c && results.length < limit) { results.push({ id: c.key, ...c.value }); c.continue(); }
                    else resolve(results);
                };
                req.onerror = () => resolve([]);
            });
        }

        async function getTradeCount() {
            if (!db) return 0;
            return new Promise(resolve => {
                const req = db.transaction('trades', 'readonly').objectStore('trades').count();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(0);
            });
        }

        async function getAllTrades() {
            if (!db) return [];
            return new Promise(resolve => {
                const req = db.transaction('trades', 'readonly').objectStore('trades').getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => resolve([]);
            });
        }

        async function saveCandles() {
            if (!db) return;
            db.transaction('candles', 'readwrite').objectStore('candles').put({ key: 'data', candles: candleData });
        }

        async function loadCandles() {
            if (!db) return;
            return new Promise(resolve => {
                const req = db.transaction('candles', 'readonly').objectStore('candles').get('data');
                req.onsuccess = () => { if (req.result?.candles) candleData = req.result.candles; resolve(); };
                req.onerror = () => resolve();
            });
        }

        async function clearAllData() {
            if (!confirm('全データを削除しますか？')) return;
            const tx = db.transaction(['trades', 'candles'], 'readwrite');
            tx.objectStore('trades').clear(); tx.objectStore('candles').clear();
            intervals.forEach(i => candleData[i] = {});
            document.getElementById('tradesList').innerHTML = '<div class="loading">No data</div>';
            oldestLoadedId = Infinity; firstPrice = null; updateChart(); updateStats();
        }

        async function exportCSV() {
            const trades = await getAllTrades();
            if (!trades.length) return alert('データがありません');
            let csv = 'Time,DateTime,Price,Size,Value,Side,Buyer,Seller\n';
            trades.forEach(t => {
                csv += `${t.time},${new Date(t.time).toISOString()},${t.price},${t.size},${(t.price*t.size).toFixed(2)},${t.side==='A'?'Buy':'Sell'},${t.buyer},${t.seller}\n`;
            });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            a.download = `silver_${Date.now()}.csv`; a.click();
        }

        function shortAddr(a) { return a && a.length > 10 ? a.slice(0,6) : a || '?'; }
        function fmtUSD(v) { return v >= 1000 ? v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : v.toFixed(2); }

        function createTradeRow(t, isNew = false) {
            const row = document.createElement('div');
            row.className = 'trade-row' + (isNew ? ' new' : '');
            row.dataset.id = t.id; row.dataset.buyer = t.buyer; row.dataset.seller = t.seller;
            const isBuy = t.side === 'A';
            const usd = t.price * t.size;
            const dateStr = new Date(t.time).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            
            row.innerHTML = `
                <div class="date">${dateStr}</div>
                <div class="${isBuy ? 'type-buy' : 'type-sell'}">${isBuy ? 'Buy' : 'Sell'}</div>
                <div class="usd">${fmtUSD(usd)}</div>
                <div class="size">${t.size.toFixed(4)}</div>
                <div class="price">$${t.price.toFixed(3)}</div>
                <div class="maker"><a href="https://hyperbot.network/trader/${t.buyer}" target="_blank">${shortAddr(t.buyer)}</a><span class="pos-cell" data-a="${t.buyer}">${fmtPos(null)}</span></div>
                <div class="maker"><a href="https://hyperbot.network/trader/${t.seller}" target="_blank">${shortAddr(t.seller)}</a><span class="pos-cell" data-a="${t.seller}">${fmtPos(null)}</span></div>
                <div class="txn"><a href="https://app.hyperliquid.xyz/trade/${COIN}" target="_blank">↗</a></div>
            `;
            return row;
        }

        async function loadPositionsForRow(row) {
            const [bp, sp] = await Promise.all([fetchPosition(row.dataset.buyer), fetchPosition(row.dataset.seller)]);
            const bc = row.querySelector(`.pos-cell[data-a="${row.dataset.buyer}"]`);
            const sc = row.querySelector(`.pos-cell[data-a="${row.dataset.seller}"]`);
            if (bc) bc.innerHTML = fmtPos(bp);
            if (sc) sc.innerHTML = fmtPos(sp);
        }

        async function loadMoreTrades() {
            if (isLoadingMore) return;
            isLoadingMore = true;
            const trades = await getTradesPage(oldestLoadedId, BATCH_SIZE);
            if (!trades.length) { isLoadingMore = false; return; }
            const list = document.getElementById('tradesList');
            const ld = list.querySelector('.loading'); if (ld) ld.remove();
            for (const t of trades) {
                const row = createTradeRow(t);
                list.appendChild(row);
                if (t.id < oldestLoadedId) oldestLoadedId = t.id;
                loadPositionsForRow(row);
            }
            isLoadingMore = false;
        }

        async function addNewTrade(trade) {
            const id = await saveTrade(trade);
            if (!id) return;
            const t = { id, time: trade.time, price: parseFloat(trade.px), size: parseFloat(trade.sz),
                side: trade.side, buyer: (trade.users||['?','?'])[0], seller: (trade.users||['?','?'])[1] };
            const list = document.getElementById('tradesList');
            const ld = list.querySelector('.loading'); if (ld) ld.remove();
            const row = createTradeRow(t, true);
            list.insertBefore(row, list.firstChild);
            loadPositionsForRow(row);
            while (list.children.length > 500) {
                const last = list.lastChild;
                oldestLoadedId = Math.min(oldestLoadedId, parseInt(last.dataset.id) || Infinity);
                list.removeChild(last);
            }
            updatePrice(t.price);
            updateAllCandles(trade);
        }

        function updatePrice(price) {
            document.getElementById('currentPrice').textContent = '$' + price.toFixed(3);
            if (firstPrice === null) firstPrice = price;
            const change = ((price - firstPrice) / firstPrice * 100);
            const changeEl = document.getElementById('priceChange');
            changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
            changeEl.className = 'price-change ' + (change >= 0 ? 'price-up' : 'price-down');
        }

        function scrollToTop() { document.getElementById('tradesList').scrollTo({ top: 0, behavior: 'smooth' }); }

        async function updateStats() {
            const count = await getTradeCount();
            document.getElementById('totalTrades').textContent = count.toLocaleString();
            const size = JSON.stringify(candleData).length + (count * 150);
            document.getElementById('dataSize').textContent = (size / 1024).toFixed(0) + ' KB';
        }

        function initChart() {
            const c = document.getElementById('chart');
            chart = LightweightCharts.createChart(c, {
                width: c.clientWidth, height: 380,
                layout: { background: { type: 'solid', color: '#111' }, textColor: '#555' },
                grid: { vertLines: { color: '#1a1a1a' }, horzLines: { color: '#1a1a1a' } },
                rightPriceScale: { borderColor: '#1a1a1a' },
                timeScale: { borderColor: '#1a1a1a', timeVisible: true, secondsVisible: true },
                crosshair: { mode: 0, vertLine: { color: '#333', labelBackgroundColor: '#222' }, horzLine: { color: '#333', labelBackgroundColor: '#222' } }
            });
            candleSeries = chart.addCandlestickSeries({
                upColor: '#00c853', downColor: '#ff5252',
                borderUpColor: '#00c853', borderDownColor: '#ff5252',
                wickUpColor: '#00c853', wickDownColor: '#ff5252',
                priceFormat: { type: 'price', precision: 3, minMove: 0.001 }
            });
            window.addEventListener('resize', () => chart.applyOptions({ width: c.clientWidth }));
        }

        function updateAllCandles(trade) {
            const price = parseFloat(trade.px), tradeSec = Math.floor(trade.time / 1000);
            intervals.forEach(interval => {
                const sec = intervalSeconds[interval], candleTime = Math.floor(tradeSec / sec) * sec;
                if (!candleData[interval][candleTime]) {
                    candleData[interval][candleTime] = { time: candleTime, open: price, high: price, low: price, close: price };
                } else {
                    const cd = candleData[interval][candleTime];
                    cd.high = Math.max(cd.high, price); cd.low = Math.min(cd.low, price); cd.close = price;
                }
            });
            updateChart();
        }

        function updateChart() {
            const data = Object.values(candleData[currentInterval]).sort((a, b) => a.time - b.time);
            candleSeries.setData(data);
            document.getElementById('chartInfo').textContent = `Candles: ${data.length}`;
        }

        function changeInterval(interval) {
            currentInterval = interval;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            updateChart(); chart.timeScale().fitContent();
        }

        function connect() {
            document.getElementById('statusDot').classList.remove('connected');
            document.getElementById('statusText').textContent = 'Connecting...';
            ws = new WebSocket('wss://api.hyperliquid.xyz/ws');
            ws.onopen = () => {
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = 'Live';
                ws.send(JSON.stringify({ method: 'subscribe', subscription: { type: 'trades', coin: COIN } }));
            };
            ws.onmessage = (e) => { try { const d = JSON.parse(e.data); if (d.channel === 'trades' && d.data) d.data.forEach(addNewTrade); } catch {} };
            ws.onclose = () => {
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = 'Reconnecting...';
                setTimeout(connect, 3000);
            };
        }

        function setupScroll() {
            const list = document.getElementById('tradesList'), btn = document.getElementById('scrollTop');
            list.addEventListener('scroll', () => {
                btn.style.display = list.scrollTop > 150 ? 'block' : 'none';
                if (list.scrollTop + list.clientHeight >= list.scrollHeight - 80) loadMoreTrades();
            });
        }

        async function init() {
            await openDB(); await loadCandles(); initChart(); updateChart(); setupScroll();
            await loadMoreTrades(); await updateStats(); connect();
            setInterval(() => { saveCandles(); updateStats(); }, 10000);
        }
        init();
    </script>
</body>
</html>
