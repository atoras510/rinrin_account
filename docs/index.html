<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperliquid xyz:SILVER Trades Monitor</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Consolas, monospace;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }

        h1 {
            color: #00d4aa;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #111;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #00d4aa;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats {
            display: flex;
            gap: 30px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            color: #00d4aa;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #666;
        }

        .price-display {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .current-price {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
        }

        .price-change {
            font-size: 1.2rem;
            margin-top: 5px;
        }

        .price-up { color: #00d4aa; }
        .price-down { color: #ff4757; }

        .chart-section {
            background: #111;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .chart-title {
            color: #888;
            font-size: 0.9rem;
        }

        .timeframe-selector {
            display: flex;
            gap: 5px;
        }

        .timeframe-btn {
            background: #222;
            border: 1px solid #333;
            color: #888;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .timeframe-btn.active {
            background: #00d4aa;
            color: #000;
            border-color: #00d4aa;
        }

        #chart {
            width: 100%;
            height: 300px;
        }

        .trades-container {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
        }

        .trades-header {
            display: grid;
            grid-template-columns: 70px 90px 60px 75px 150px 150px 50px;
            padding: 15px 20px;
            background: #1a1a2e;
            font-weight: bold;
            color: #888;
            font-size: 0.85rem;
        }

        .trades-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .trade-row {
            display: grid;
            grid-template-columns: 70px 90px 60px 75px 150px 150px 50px;
            padding: 10px 20px;
            border-bottom: 1px solid #222;
            font-size: 0.85rem;
            transition: background 0.3s;
        }

        .trade-row:hover {
            background: #1a1a2e;
        }

        .trade-row.new {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                background: rgba(0, 212, 170, 0.2);
            }
            to {
                background: transparent;
            }
        }

        .side-buy {
            color: #00d4aa;
            font-weight: bold;
        }

        .side-sell {
            color: #ff4757;
            font-weight: bold;
        }

        .trader-cell {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .address {
            color: #6c7a89;
            font-size: 0.8rem;
        }

        .address a {
            color: #6c7a89;
            text-decoration: none;
        }

        .address a:hover {
            color: #00d4aa;
            text-decoration: underline;
        }

        .position {
            font-size: 0.75rem;
            padding: 2px 5px;
            border-radius: 3px;
            white-space: nowrap;
        }

        .position.long {
            color: #00d4aa;
            background: rgba(0, 212, 170, 0.15);
        }

        .position.short {
            color: #ff4757;
            background: rgba(255, 71, 87, 0.15);
        }

        .position.neutral {
            color: #888;
            background: rgba(136, 136, 136, 0.15);
        }

        .time {
            color: #888;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #444;
            font-size: 0.8rem;
        }

        footer a {
            color: #00d4aa;
            text-decoration: none;
        }

        /* Scrollbar */
        .trades-list::-webkit-scrollbar {
            width: 8px;
        }

        .trades-list::-webkit-scrollbar-track {
            background: #111;
        }

        .trades-list::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .loading-more {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 900px) {
            .trades-header, .trade-row {
                grid-template-columns: 60px 80px 55px 70px 1fr 50px;
            }
            .trade-row .trader-cell:nth-child(6),
            .trades-header > *:nth-child(6) {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .trades-header, .trade-row {
                grid-template-columns: 55px 75px 50px 65px 50px;
            }
            .trade-row .trader-cell,
            .trades-header > *:nth-child(5),
            .trades-header > *:nth-child(6) {
                display: none;
            }
            .stats {
                gap: 15px;
            }
            .current-price {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>xyz:SILVER Trades Monitor</h1>
            <p class="subtitle">Hyperliquid Real-time Trade Feed</p>
        </header>

        <div class="status-bar">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="tradeCount">0</div>
                    <div class="stat-label">Trades</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="volume">$0</div>
                    <div class="stat-label">Volume</div>
                </div>
            </div>
        </div>

        <div class="price-display">
            <div class="current-price" id="currentPrice">$--</div>
            <div class="price-change" id="priceChange">--</div>
        </div>

        <div class="chart-section">
            <div class="chart-header">
                <span class="chart-title">Price Chart</span>
                <div class="timeframe-selector">
                    <button class="timeframe-btn" data-tf="1">1s</button>
                    <button class="timeframe-btn" data-tf="5">5s</button>
                    <button class="timeframe-btn active" data-tf="60">1m</button>
                    <button class="timeframe-btn" data-tf="300">5m</button>
                </div>
            </div>
            <div id="chart"></div>
        </div>

        <div class="trades-container">
            <div class="trades-header">
                <div>Time</div>
                <div>Price</div>
                <div>Size</div>
                <div>Value</div>
                <div>Buyer</div>
                <div>Seller</div>
                <div>Side</div>
            </div>
            <div class="trades-list" id="tradesList">
                <div style="padding: 40px; text-align: center; color: #666;">
                    Waiting for trades...
                </div>
            </div>
        </div>

        <footer>
            <p>Data from <a href="https://app.hyperliquid.xyz/trade/xyz:SILVER" target="_blank">Hyperliquid</a></p>
            <p style="margin-top: 10px;">WebSocket: wss://api.hyperliquid.xyz/ws</p>
        </footer>
    </div>

    <script>
        const WS_URL = 'wss://api.hyperliquid.xyz/ws';
        const COIN = 'xyz:SILVER';
        const DEX = 'xyz';
        const DB_NAME = 'SilverTradesDB';
        const DB_VERSION = 1;

        let ws = null;
        let tradeCount = 0;
        let totalVolume = 0;
        let lastPrice = null;
        let firstPrice = null;
        let reconnectAttempts = 0;
        let db = null;

        // Chart
        let chart = null;
        let candleSeries = null;
        let currentTimeframe = 60;
        let candles = {};
        let allTimeframes = [1, 5, 60, 300];

        // Position cache
        const positionCache = new Map();
        const POSITION_CACHE_TTL = 30000;

        // IndexedDB setup
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('trades')) {
                        const store = database.createObjectStore('trades', { keyPath: 'tid' });
                        store.createIndex('time', 'time', { unique: false });
                    }
                    if (!database.objectStoreNames.contains('candles')) {
                        database.createObjectStore('candles', { keyPath: ['timeframe', 'time'] });
                    }
                };
            });
        }

        async function saveTrade(trade) {
            if (!db) return;
            const tx = db.transaction('trades', 'readwrite');
            const store = tx.objectStore('trades');
            store.put(trade);
        }

        async function saveCandle(timeframe, candle) {
            if (!db) return;
            const tx = db.transaction('candles', 'readwrite');
            const store = tx.objectStore('candles');
            store.put({ timeframe, ...candle });
        }

        async function loadCandles(timeframe) {
            if (!db) return [];
            return new Promise((resolve) => {
                const tx = db.transaction('candles', 'readonly');
                const store = tx.objectStore('candles');
                const result = [];
                const request = store.openCursor();
                request.onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) {
                        if (cursor.value.timeframe === timeframe) {
                            result.push(cursor.value);
                        }
                        cursor.continue();
                    } else {
                        resolve(result.sort((a, b) => a.time - b.time));
                    }
                };
            });
        }

        async function loadOlderTrades(beforeTime, limit = 100) {
            if (!db) return [];
            return new Promise((resolve) => {
                const tx = db.transaction('trades', 'readonly');
                const store = tx.objectStore('trades');
                const index = store.index('time');
                const range = IDBKeyRange.upperBound(beforeTime, true);
                const result = [];
                const request = index.openCursor(range, 'prev');
                request.onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor && result.length < limit) {
                        result.push(cursor.value);
                        cursor.continue();
                    } else {
                        resolve(result);
                    }
                };
            });
        }

        // Chart initialization
        function initChart() {
            const container = document.getElementById('chart');
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: 300,
                layout: {
                    background: { color: '#111' },
                    textColor: '#888'
                },
                grid: {
                    vertLines: { color: '#222' },
                    horzLines: { color: '#222' }
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: true
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal
                }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#00d4aa',
                downColor: '#ff4757',
                borderUpColor: '#00d4aa',
                borderDownColor: '#ff4757',
                wickUpColor: '#00d4aa',
                wickDownColor: '#ff4757',
                priceFormat: { type: 'price', precision: 3, minMove: 0.001 }
            });

            // Initialize candle storage for all timeframes
            allTimeframes.forEach(tf => {
                candles[tf] = [];
            });

            // Timeframe buttons
            document.querySelectorAll('.timeframe-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTimeframe = parseInt(btn.dataset.tf);
                    await updateChartData();
                });
            });

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: container.clientWidth });
            });
        }

        async function updateChartData() {
            const stored = await loadCandles(currentTimeframe);
            if (stored.length > 0) {
                candles[currentTimeframe] = stored;
            }
            const data = candles[currentTimeframe].map(c => ({
                time: c.time,
                open: c.open,
                high: c.high,
                low: c.low,
                close: c.close
            }));
            candleSeries.setData(data);
            if (data.length > 0) {
                chart.timeScale().fitContent();
            }
        }

        function updateCandle(price, timestamp) {
            const priceNum = parseFloat(price);

            allTimeframes.forEach(tf => {
                const candleTime = Math.floor(timestamp / 1000 / tf) * tf;
                const candleArray = candles[tf];

                if (candleArray.length === 0 || candleArray[candleArray.length - 1].time !== candleTime) {
                    const newCandle = {
                        time: candleTime,
                        open: priceNum,
                        high: priceNum,
                        low: priceNum,
                        close: priceNum
                    };
                    candleArray.push(newCandle);
                    saveCandle(tf, newCandle);
                } else {
                    const candle = candleArray[candleArray.length - 1];
                    candle.high = Math.max(candle.high, priceNum);
                    candle.low = Math.min(candle.low, priceNum);
                    candle.close = priceNum;
                    saveCandle(tf, candle);
                }
            });

            // Update chart for current timeframe
            const currentCandles = candles[currentTimeframe];
            if (currentCandles.length > 0) {
                const lastCandle = currentCandles[currentCandles.length - 1];
                candleSeries.update({
                    time: lastCandle.time,
                    open: lastCandle.open,
                    high: lastCandle.high,
                    low: lastCandle.low,
                    close: lastCandle.close
                });
            }
        }

        // Position fetching
        async function fetchPosition(address) {
            const cached = positionCache.get(address);
            if (cached && Date.now() - cached.timestamp < POSITION_CACHE_TTL) {
                return cached.position;
            }

            try {
                const res = await fetch('https://api.hyperliquid.xyz/info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'clearinghouseState', user: address, dex: DEX })
                });
                const data = await res.json();
                let position = 0;
                if (data && data.assetPositions) {
                    const pos = data.assetPositions.find(p => p.position && p.position.coin === COIN);
                    if (pos && pos.position) {
                        position = parseFloat(pos.position.szi) || 0;
                    }
                }
                positionCache.set(address, { position, timestamp: Date.now() });
                return position;
            } catch (e) {
                console.error('Position fetch error:', e);
                return 0;
            }
        }

        function formatPosition(pos) {
            if (pos === 0) return '<span class="position neutral">0</span>';
            const cls = pos > 0 ? 'long' : 'short';
            const sign = pos > 0 ? '+' : '';
            return `<span class="position ${cls}">${sign}${pos.toFixed(2)}</span>`;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('ja-JP', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function formatPrice(price) {
            return '$' + parseFloat(price).toFixed(3);
        }

        function formatVolume(volume) {
            if (volume >= 1000000) {
                return '$' + (volume / 1000000).toFixed(2) + 'M';
            } else if (volume >= 1000) {
                return '$' + (volume / 1000).toFixed(2) + 'K';
            }
            return '$' + volume.toFixed(2);
        }

        function shortenAddress(addr) {
            if (!addr || addr.length < 12) return addr || 'unknown';
            return addr.slice(0, 6) + '...' + addr.slice(-4);
        }

        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (connected) {
                dot.classList.add('connected');
                text.textContent = 'Connected';
            } else {
                dot.classList.remove('connected');
                text.textContent = 'Disconnected';
            }
        }

        function updatePrice(price) {
            const priceEl = document.getElementById('currentPrice');
            const changeEl = document.getElementById('priceChange');

            priceEl.textContent = formatPrice(price);

            if (firstPrice === null) {
                firstPrice = parseFloat(price);
            }

            if (lastPrice !== null) {
                const change = parseFloat(price) - firstPrice;
                const changePct = ((parseFloat(price) - firstPrice) / firstPrice * 100);

                changeEl.textContent = `${change >= 0 ? '+' : ''}${change.toFixed(3)} (${changePct >= 0 ? '+' : ''}${changePct.toFixed(2)}%)`;
                changeEl.className = 'price-change ' + (change >= 0 ? 'price-up' : 'price-down');
            }

            lastPrice = parseFloat(price);
        }

        async function addTrade(trade) {
            const list = document.getElementById('tradesList');

            // Remove waiting message
            if (tradeCount === 0) {
                list.innerHTML = '';
            }

            const users = trade.users || ['unknown', 'unknown'];
            const price = parseFloat(trade.px);
            const size = parseFloat(trade.sz);
            const value = price * size;
            const isBuy = trade.side === 'A';

            tradeCount++;
            totalVolume += value;

            // Save to IndexedDB
            saveTrade({
                tid: trade.tid || `${trade.time}-${tradeCount}`,
                time: trade.time,
                px: trade.px,
                sz: trade.sz,
                side: trade.side,
                users: users
            });

            // Update candles
            updateCandle(trade.px, trade.time);

            // Update stats
            document.getElementById('tradeCount').textContent = tradeCount;
            document.getElementById('volume').textContent = formatVolume(totalVolume);
            updatePrice(trade.px);

            // Fetch positions
            const [buyerPos, sellerPos] = await Promise.all([
                fetchPosition(users[0]),
                fetchPosition(users[1])
            ]);

            // Create trade row
            const row = document.createElement('div');
            row.className = 'trade-row new';
            row.innerHTML = `
                <div class="time">${formatTime(trade.time)}</div>
                <div>${formatPrice(trade.px)}</div>
                <div>${parseFloat(trade.sz).toFixed(2)}</div>
                <div>${formatVolume(value)}</div>
                <div class="trader-cell">
                    <span class="address"><a href="https://hyperbot.network/trader/${users[0]}" target="_blank" title="${users[0]}">${shortenAddress(users[0])}</a></span>
                    ${formatPosition(buyerPos)}
                </div>
                <div class="trader-cell">
                    <span class="address"><a href="https://hyperbot.network/trader/${users[1]}" target="_blank" title="${users[1]}">${shortenAddress(users[1])}</a></span>
                    ${formatPosition(sellerPos)}
                </div>
                <div class="${isBuy ? 'side-buy' : 'side-sell'}">${isBuy ? 'B' : 'S'}</div>
            `;

            list.insertBefore(row, list.firstChild);

            // Remove animation class
            setTimeout(() => row.classList.remove('new'), 500);
        }

        // Infinite scroll
        let isLoadingMore = false;
        let oldestTradeTime = null;

        async function loadMoreTrades() {
            if (isLoadingMore || !oldestTradeTime) return;
            isLoadingMore = true;

            const list = document.getElementById('tradesList');
            const loadingEl = document.createElement('div');
            loadingEl.className = 'loading-more';
            loadingEl.textContent = 'Loading...';
            list.appendChild(loadingEl);

            const olderTrades = await loadOlderTrades(oldestTradeTime);
            loadingEl.remove();

            if (olderTrades.length === 0) {
                isLoadingMore = false;
                return;
            }

            for (const trade of olderTrades) {
                const users = trade.users || ['unknown', 'unknown'];
                const price = parseFloat(trade.px);
                const size = parseFloat(trade.sz);
                const value = price * size;
                const isBuy = trade.side === 'A';

                const row = document.createElement('div');
                row.className = 'trade-row';
                row.innerHTML = `
                    <div class="time">${formatTime(trade.time)}</div>
                    <div>${formatPrice(trade.px)}</div>
                    <div>${parseFloat(trade.sz).toFixed(2)}</div>
                    <div>${formatVolume(value)}</div>
                    <div class="trader-cell">
                        <span class="address"><a href="https://hyperbot.network/trader/${users[0]}" target="_blank" title="${users[0]}">${shortenAddress(users[0])}</a></span>
                        <span class="position neutral">-</span>
                    </div>
                    <div class="trader-cell">
                        <span class="address"><a href="https://hyperbot.network/trader/${users[1]}" target="_blank" title="${users[1]}">${shortenAddress(users[1])}</a></span>
                        <span class="position neutral">-</span>
                    </div>
                    <div class="${isBuy ? 'side-buy' : 'side-sell'}">${isBuy ? 'B' : 'S'}</div>
                `;
                list.appendChild(row);
                oldestTradeTime = trade.time;
            }

            isLoadingMore = false;
        }

        function connect() {
            console.log('Connecting to WebSocket...');

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('Connected!');
                updateStatus(true);
                reconnectAttempts = 0;

                // Subscribe to trades
                ws.send(JSON.stringify({
                    method: 'subscribe',
                    subscription: {
                        type: 'trades',
                        coin: COIN
                    }
                }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.channel === 'trades') {
                        const trades = data.data || [];
                        trades.forEach(trade => {
                            addTrade(trade);
                            if (!oldestTradeTime || trade.time < oldestTradeTime) {
                                oldestTradeTime = trade.time;
                            }
                        });
                    } else if (data.channel === 'subscriptionResponse') {
                        console.log('Subscribed:', data);
                    }
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };

            ws.onclose = () => {
                console.log('Disconnected');
                updateStatus(false);

                // Reconnect with backoff
                reconnectAttempts++;
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                console.log(`Reconnecting in ${delay}ms...`);
                setTimeout(connect, delay);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        // Initialize
        async function init() {
            await initDB();
            initChart();
            await updateChartData();

            // Scroll listener for infinite scroll
            const list = document.getElementById('tradesList');
            list.addEventListener('scroll', () => {
                if (list.scrollTop + list.clientHeight >= list.scrollHeight - 50) {
                    loadMoreTrades();
                }
            });

            connect();
        }

        init();
    </script>
